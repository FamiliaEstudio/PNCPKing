name: Build PNCP King Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build, test and publish
        shell: pwsh
        run: ./scripts/publish-windows.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PNCPKing-win-x64-${{ github.sha }}
          path: |
            artifacts/win-x64/PNCPKing.exe
            artifacts/win-x64/app-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content ./src/PNCPKing.App/PNCPKing.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          $null = ./scripts/read-release-notes.ps1 -Version $version
          $notesPath = "./docs/releases/$tag.md"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A release $tag ja existe." }
          gh release create $tag ./artifacts/win-x64/PNCPKing.exe ./artifacts/win-x64/app-update.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PNCP King $version" --notes-file $notesPath --latest
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a release $tag." }

      - name: Restore price compatibility for installed legacy programs
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[price-compat]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'pncpking-price-source'
          $output = Join-Path $env:RUNNER_TEMP 'pncpking-price-assets'
          New-Item -ItemType Directory -Path $source, $output -Force | Out-Null
          $release = gh release view precos --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao consultar a release de precos.' }
          $manifestName = if (@($release.assets | Where-Object name -eq 'prices-update-v2.json').Count) {
            'prices-update-v2.json'
          } else { 'prices-update.json' }
          gh release download precos --repo $env:GITHUB_REPOSITORY --pattern $manifestName --dir $source
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar o manifesto de precos.' }
          $metadata = Get-Content (Join-Path $source $manifestName) -Raw | ConvertFrom-Json
          if (@($metadata.update.download.parts).Count -ne 1) { throw 'Pacote de precos inesperado.' }
          $file = $metadata.update.download.parts[0]
          gh release download precos --repo $env:GITHUB_REPOSITORY --pattern $file.name --dir $source
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar o pacote de precos.' }
          $package = Join-Path $source $file.name
          if ((Get-Item $package).Length -ne $file.size -or
              (Get-FileHash $package -Algorithm SHA256).Hash -ne $file.sha256) {
            throw 'O pacote de origem diverge da publicacao.'
          }
          ./scripts/prepare-github-prices.ps1 -UpdatePackage $package -OutputDirectory $output -MinimumAppVersion $metadata.minimumAppVersion
          # Payloads first, current manifest second, legacy manifest last. Existing assets stay available.
          foreach ($asset in Get-ChildItem $output -Filter '*.pncpupdate') {
            if ($asset.Name -eq $file.name) { continue }
            gh release upload precos $asset.FullName --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar o pacote de compatibilidade.' }
          }
          gh release upload precos (Join-Path $output 'prices-update-v2.json') --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar o manifesto atual.' }
          gh release upload precos (Join-Path $output 'prices-update.json') --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar o manifesto legado.' }
          gh release edit precos --repo $env:GITHUB_REPOSITORY --notes-file ./docs/releases/precos-20261008.md
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao atualizar as notas de precos.' }
