name: Build PNCP King Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build, test and publish
        shell: pwsh
        run: ./scripts/publish-windows.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PNCPKing-win-x64-${{ github.sha }}
          path: |
            artifacts/win-x64/PNCPKing.exe
            artifacts/win-x64/app-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content ./src/PNCPKing.App/PNCPKing.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A release $tag ja existe." }
          $notes = @"
          ## Janelas adaptadas a monitores menores e escalas diferentes

          - As janelas principais de cotação cabem na área útil do monitor, inclusive após troca de monitor ou DPI.
          - Barras de comandos e a seleção de documentos se ajustam a larguras menores.
          - A etapa de pesquisa temporal da cotação por IA reorganiza campos e pesos em várias linhas.
          - O seletor de colunas permite restaurar larguras, ordem e visibilidade padrão da tabela.
          - Mantém as melhorias de retenção da v1.2.3 e o esquema 30, sem migração do banco.
          "@
          gh release create $tag ./artifacts/win-x64/PNCPKing.exe ./artifacts/win-x64/app-update.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PNCP King $version — janelas adaptadas a diferentes monitores" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a release $tag." }
