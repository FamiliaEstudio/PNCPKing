name: Build PNCP King Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build, test and publish
        shell: pwsh
        run: ./scripts/publish-windows.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PNCPKing-win-x64-${{ github.sha }}
          path: |
            artifacts/win-x64/PNCPKing.exe
            artifacts/win-x64/app-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content ./src/PNCPKing.App/PNCPKing.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A release $tag ja existe." }
          $notes = @"
          ## Correção do atualizador em máquinas lentas

          - Aumenta de 10 para 120 segundos o prazo de handshake do instalador auxiliar.
          - Mantém a validação SHA-256 integral do executável antes da substituição.
          - Evita falso erro "O instalador não respondeu" em HDDs lentos, máquinas sob pressão de memória ou durante varredura do antivírus.
          - O banco de dados do usuário permanece separado e não é incluído no executável.
          "@
          gh release create $tag ./artifacts/win-x64/PNCPKing.exe ./artifacts/win-x64/app-update.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PNCP King $version — correção do atualizador" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a release $tag." }
